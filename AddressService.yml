server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/address
    username: root
    password: ${password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost

employee:
  service:
    url: http://localhost:8081
